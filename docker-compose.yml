version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motor-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - API_PORT=8000
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - motor-network

  frontend:
    image: nginx:alpine
    container_name: motor-frontend
    ports:
      - "3000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - motor-network

networks:
  motor-network:
    driver: bridge

volumes:
  uploads:
  reports:
